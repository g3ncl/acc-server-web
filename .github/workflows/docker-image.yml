name: Remove obsolete main image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        id: find
        with:
          script: |
            const versions = await github.paginate(
              'GET /users/{username}/packages/{package_type}/{package_name}/versions',
              { username: context.repo.owner, package_type: 'container', package_name: context.repo.repo, per_page: 100 }
            );
            const candidates = versions.filter(v => v.metadata?.container?.tags?.includes('main'));
            for (const version of candidates) {
              if (version.metadata.container.tags.length !== 1) {
                throw new Error(`Refusing to delete version ${version.id}: it also has release tags`);
              }
              core.info(`Selected obsolete main-only image version ${version.id}`);
            }
            core.setOutput('ids', candidates.map(v => v.id).join(','));
      - uses: actions/delete-package-versions@v5
        if: steps.find.outputs.ids != ''
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          package-version-ids: ${{ steps.find.outputs.ids }}
